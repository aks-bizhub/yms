<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    display: flex;

  .card:active { transform: scale(0.98); }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .card h2 {
    font-size: 18px;
    color: #1a1a2e;

    color: #6b7280;
  }
  .card.dairy { border-left-color: #10b981; }
  .card.payment { border-left-color: #f59e0b; }
  .card.ledger { border-left-color: #6366f1; }
  footer {
    text-align: center;
    margin-top: 24px;
